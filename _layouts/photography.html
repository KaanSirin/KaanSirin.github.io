---
layout: default
---

{{ content }}

<!-- <h4 class="fw-bold border-bottom pb-3 mb-5">Photos</h4> -->
<hr style="border-top: 3px solid #ccc;">
{% for photo in site.data.extra.images %}
<div class="row mb-5 justify-content-center">
  <div class="col-md-8 text-center">
    <img 
      src="{{ site.github.url }}{{ photo.path }}" 
      alt="{{ photo.tab }}" 
      class="img-fluid rounded mb-3"
    >
    <p class="text-muted fst-italic">
      {{ photo.alt }}
    </p>
  </div>
</div>
{% endfor %}
