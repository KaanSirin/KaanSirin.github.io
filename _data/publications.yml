index:
- {name: 'Quantifying Global Foreign Affairs with a Multimodal Dataset of Diplomatic Websites', url: 'http://doi.org/10.1038/s41597-025-06334-5', authors: 'Muğurtay, N., <strong>Şirin, K.G. </strong>, Heshmat Najafabad, M. <i>et al.</i>', pub: 'Sci Data (2025)', path: 'assets/img/figure1.jpg',abstract: 'This research introduces a global dataset of diplomatic news and images compiled from the official webpages of ministries of foreign affairs and chief executive offices across 156 countries spanning over 20 years. The collection provides over 1.16 million news articles and 1.18 million associated images. Our research initially shows how web scraping and Natural Language Processing (NLP) tools enhance labor-saving, novel data acquisition and processing methods. First, we extracted named entities for people, countries, and organizations mentioned in diplomatic texts. Second, GlobalDiplomacyNET processes and analyzes images published on diplomatic webpages, capturing governments’ image-sharing practices. This textual and visual information together provides substantial information on countries’ news-sharing habits, geographical and multilateral attention, visual assertiveness, and gender representation. GlobalDiplomacyNET is the first of its kind, offering a global corpus of textual and visual data that support novel research directions particularly in international relations and political science.'}